<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KubeJS Thaumaturge</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Guide for the KubeJS Thaumaturge addon">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  <style>
    :root {
      --theme-color: #9b7bd4;
    }
    .sidebar, body { background: #1b1b1f; }
    .markdown-section code { background: #2a2a30; color: #c9b8ff; }
    .markdown-section pre { background: #232329; }
    .markdown-section pre > code { background: #232329; color: #d4d4d8; }
    .markdown-section tr:nth-child(2n) { background: #232329; }
    .markdown-section table td, .markdown-section table th { border-color: #35353d; }
    .markdown-section blockquote { border-left-color: #9b7bd4; }
    .sidebar ul li.active > a { color: #9b7bd4; }
    .app-name-link { color: #9b7bd4 !important; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'KubeJS Thaumaturge',
      repo: 'Leclowndu93150/KubeJSThaumaturge',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
